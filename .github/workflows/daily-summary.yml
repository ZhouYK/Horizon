name: Daily Horizon Summary

on:
  workflow_dispatch:      # Allow manual trigger
  repository_dispatch:    # Triggered daily by an external cron (cron-job.org)
    types: [daily-summary-trigger]

jobs:
  check-already-ran:
    # Guards against duplicate runs on the same day (e.g. a cron-job.org retry or a
    # manual re-trigger), which would otherwise double-commit gh-pages and
    # double-send the webhook notification. Skip the real job if today's summary
    # already exists on gh-pages.
    runs-on: ubuntu-latest
    outputs:
      already_ran: ${{ steps.check.outputs.already_ran }}
    steps:
      - name: Determine today's date (Asia/Shanghai)
        id: date
        run: echo "date=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Check gh-pages for today's summary
        id: check
        env:
          TODAY: ${{ steps.date.outputs.date }}
          REPO: ${{ github.repository }}
        run: |
          if git clone --depth=1 --branch gh-pages "https://github.com/${REPO}.git" gh-pages-check 2>/dev/null; then
            if ls gh-pages-check/_posts/"${TODAY}"-summary* >/dev/null 2>&1; then
              echo "Found existing summary for ${TODAY}, skipping."
              echo "already_ran=true" >> "$GITHUB_OUTPUT"
            else
              echo "already_ran=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "gh-pages branch not found yet, proceeding."
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
          fi

  daily-summary:
    needs: check-already-ran
    if: needs.check-already-ran.outputs.already_ran != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    services:
      rsshub:
        image: diygod/rsshub:latest
        ports:
          - 1200:1200
        env:
          NODE_ENV: production
          CACHE_TYPE: memory

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Wait for RSSHub to be ready
        run: sleep 5

      - name: Run Horizon
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your data/config.github.json provider settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          RSSHUB_BASE_URL: http://localhost:1200
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
